name: Compliance
description: Bias testing, regulator-facing predictor review (ADR 0004)
labels: [compliance]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Which predictors or attributes, and what regulatory or bias question?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Task checklist
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria (e.g. bias report run, flags reviewed with the user, decision recorded)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Brief for the session that picks this up, so it doesn't re-read every doc.
        Usually written by the planning session. Keep it short; point to files, don't copy them.
      value: |
        **Read first:** files + line ranges (and what to skip)
        **Data:** BQ tables or data/interim caches, keys (geoid), grain, target and city pool
        **Decisions:** already made; names to use (docs/CONTEXT.md terms)
        **Gotchas:** conflicts with other issues, slow notebooks, domain rules at risk, open questions
