name: Modelling
description: Model fitting, CV protocol, metrics, levelling or calibration
labels: [modelling]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What modelling question does this answer? Name the target (`wprop`/`wtotal`), predictor set and metrics (see docs/CONTEXT.md).
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Task checklist
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria (e.g. LOCO run with r2_pooled / r2_city / recall@10 reported, notebook executed, ADR updated)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Brief for the session that picks this up, so it doesn't re-read every doc.
        Usually written by the planning session. Keep it short; point to files, don't copy them.
      value: |
        **Read first:** files + line ranges (and what to skip)
        **Data:** BQ tables or data/interim caches, keys (geoid), grain, target and city pool
        **Decisions:** already made; names to use (docs/CONTEXT.md terms)
        **Gotchas:** conflicts with other issues, slow notebooks, domain rules at risk, open questions
